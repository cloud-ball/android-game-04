<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Playjar app icon (original): a glass jar holding a piece of each game. -->
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2150"/><stop offset="1" stop-color="#3a1d5c"/></linearGradient></defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.92) translate(-256 -254)">
    <!-- jar glass -->
    <rect x="128" y="156" width="256" height="268" rx="64" fill="#ffffff" fill-opacity="0.10" stroke="#d6e8ff" stroke-width="16"/>
    <rect x="178" y="124" width="156" height="44" rx="14" fill="#1b2150" stroke="#d6e8ff" stroke-width="14"/>
    <rect x="162" y="84" width="188" height="50" rx="18" fill="#ffc94a"/>
    <rect x="162" y="84" width="188" height="16" rx="8" fill="#ffe08a"/>
    <!-- a snake (Serpent Grid) -->
    <path d="M168 262 L214 230 L258 262 L304 230 L342 256" fill="none" stroke="#38e8a0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="342" cy="256" r="18" fill="#38e8a0"/>
    <circle cx="347" cy="250" r="5" fill="#0d1230"/>
    <!-- an emerald-cut gem (Facetfall) -->
    <g transform="translate(200 342)">
      <polygon points="-34,-50 34,-50 52,-32 52,32 34,50 -34,50 -52,32 -52,-32" fill="#7d4fd0"/>
      <polygon points="-34,-50 34,-50 22,-26 -22,-26" fill="#c3a3ff"/>
      <polygon points="-52,-32 -52,32 -28,20 -28,-20" fill="#a27ae8"/>
      <polygon points="-22,-26 22,-26 28,-20 28,20 22,26 -22,26 -28,20 -28,-20" fill="#9A6BE0"/>
      <circle cx="-10" cy="-10" r="7" fill="#ffffff" fill-opacity="0.8"/>
    </g>
    <!-- a billiard ball (Break & Bank), blue, never a black 8 -->
    <circle cx="310" cy="352" r="48" fill="#2F55C4"/>
    <circle cx="310" cy="352" r="20" fill="#f4f1e6"/>
    <circle cx="292" cy="332" r="10" fill="#ffffff" fill-opacity="0.55"/>
    <!-- glass highlight -->
    <rect x="150" y="186" width="18" height="150" rx="9" fill="#ffffff" fill-opacity="0.28"/>
  </g>
</svg>
