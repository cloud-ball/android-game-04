name: CI

on:
  push:
    branches: [main, "serpent-grid-*", "week-*"]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test-and-export:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 from Oct 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* "$dest"/

      - name: Import project
        run: godot --headless --path . --import

      - name: Unit tests (headless)
        run: |
          ./addons/gdUnit4/runtest.sh --godot_binary /usr/local/bin/godot --headless \
            --ignoreHeadlessMode -a res://tests -a res://games

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android debug APK
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cfg="$HOME/.config/godot"; mkdir -p "$cfg"
          cat > "$cfg/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          mkdir -p build
          godot --headless --path . --export-debug "Android APK" build/pocket-arena-8-debug.apk
          test -s build/pocket-arena-8-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: pocket-arena-8-debug-apk
          path: build/pocket-arena-8-debug.apk
          retention-days: 7
