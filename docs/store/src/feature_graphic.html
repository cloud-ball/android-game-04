<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:Roboto,"Helvetica Neue",Arial,sans-serif}
.bg{position:absolute;inset:0;background:linear-gradient(120deg,#151a40 0%,#2b1650 60%,#3a1d5c 100%)}
.grid{position:absolute;right:-40px;top:-30px;width:560px;height:560px;transform:perspective(700px) rotateX(48deg);
 background-image:linear-gradient(#3a5cff 2px,transparent 2px),linear-gradient(90deg,#3a5cff 2px,transparent 2px);
 background-size:46px 46px;opacity:.55;box-shadow:0 0 60px #3a5cff55}
.shot{position:absolute;right:70px;top:38px;width:196px;height:424px;border-radius:26px;overflow:hidden;
 box-shadow:0 18px 50px #000a,0 0 0 4px #ffffff22;transform:rotate(6deg)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
.shot2{right:290px;top:60px;transform:rotate(-5deg);width:180px;height:390px}
.text{position:absolute;left:64px;top:118px;color:#fff}
h1{margin:0;font-size:84px;font-weight:900;letter-spacing:1px;line-height:1}
h1 span{color:#ffc94a}
p{margin:22px 0 0;font-size:34px;font-weight:600;color:#cfd6ff}
.tag{display:inline-block;margin-top:26px;padding:10px 22px;border-radius:30px;background:#3cc35a;font-weight:800;font-size:26px}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="shot shot2"><img src="../screenshots/01_hub.png"></div>
<div class="shot"><img src="../screenshots/03_match_mid.png"></div>
<div class="text"><h1>POCKET<br>ARENA <span>8</span></h1><p>Original 3D mini-games vs the CPU</p><div class="tag">Play offline</div></div>
</body></html>
