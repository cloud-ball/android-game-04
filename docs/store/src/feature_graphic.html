<!doctype html><html><head><meta charset="utf-8"><style>
/* Play feature graphic, 1024x500. Render: Chrome headless (see SHIP_CHECKLIST.md). Font: Roboto (OFL). */
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:Roboto,"Helvetica Neue",Arial,sans-serif}
.bg{position:absolute;inset:0;background:linear-gradient(120deg,#151a40 0%,#2b1650 60%,#3a1d5c 100%)}
.grid{position:absolute;right:-60px;top:-10px;width:620px;height:560px;transform:perspective(700px) rotateX(52deg);
 background-image:linear-gradient(#3a5cff 2px,transparent 2px),linear-gradient(90deg,#3a5cff 2px,transparent 2px);
 background-size:46px 46px;opacity:.45}
.shot{position:absolute;width:168px;height:300px;border-radius:22px;overflow:hidden;
 box-shadow:0 18px 44px #000b,0 0 0 4px #ffffff26}
.shot img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.a{left:512px;top:118px;transform:rotate(-7deg)}
.b{left:688px;top:70px;transform:rotate(0deg);width:178px;height:330px;z-index:2}
.c{left:868px;top:118px;transform:rotate(7deg)}
.text{position:absolute;left:56px;top:96px;color:#fff;width:420px}
h1{margin:0;font-size:76px;font-weight:900;letter-spacing:1px;line-height:.98}
h1 span{color:#ffc94a}
p{margin:20px 0 0;font-size:28px;font-weight:600;color:#cfd6ff;line-height:1.25}
.tag{display:inline-block;margin-top:24px;padding:10px 22px;border-radius:30px;background:#3cc35a;font-weight:800;font-size:25px}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="shot a"><img src="raw/snake_2.jpg"></div>
<div class="shot b"><img src="raw/pool_1.jpg"></div>
<div class="shot c"><img src="raw/blocks_2.jpg"></div>
<div class="text"><h1>POCKET<br>ARENA <span>8</span></h1><p>Snake, pool and block races<br>against a smart CPU</p><div class="tag">Play offline · no ads</div></div>
</body></html>
